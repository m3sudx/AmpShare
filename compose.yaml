services:
  db:
    image: postgis/postgis:16-3.5
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ampshare}
      POSTGRES_USER: ${POSTGRES_USER:-ampshare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - ampshare_db_data:/var/lib/postgresql/data
      - ./server/database/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    restart: unless-stopped

    ports:
      - "3003:3003"

    environment:
      NODE_ENV: development
      PORT: 3003
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-ampshare}
      DB_USER: ${POSTGRES_USER:-ampshare}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}   # CHANGED: the Vite client origin (was :3000)

    volumes:
      - ./server/src:/app/src

    depends_on:
      db:
        condition: service_healthy

  client:                                                    # NEW
    build:
      context: ./client
      target: dev
    restart: unless-stopped

    ports:
      - "5173:5173"

    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3003/api}

    volumes:
      - ./client:/app
      - /app/node_modules

    depends_on:
      - server

volumes:
  ampshare_db_data: